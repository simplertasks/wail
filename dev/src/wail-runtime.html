<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WAIL: Web AI Markup Language Example </title>


  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.yellow.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/notyf@3/notyf.min.css">

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/notyf@3/notyf.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Dexie.js for database functionality -->
  <script src="https://unpkg.com/dexie@latest/dist/dexie.js"></script>
  <style>
    /* Splash Screen Styles */
    #splash {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100vh;
      background-color: var(--pico-background-color);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      opacity: 1;
      transition: opacity 1s ease-out;
    }

    #splash .container {
      text-align: center;
    }

    #splash.fade-out {
      opacity: 0;
      pointer-events: none;
    }

    #splash h1,
    #splash h2,
    #splash h3 {
      animation: fadeIn 1s ease-in forwards;
      margin-bottom: 1rem;
      opacity: 0;
    }

    #splash p,
    #splash mark,
    #splash form {
      animation: fadeIn 1s ease-in 0.3s forwards;
      opacity: 0;
      margin: 0 auto;
    }

    #splash img {
      animation: fadeIn 1s ease-in 0.6s forwards;
      opacity: 0;
      display: block;
      margin: 0 auto;
      max-width: 100%;
      height: auto;
    }

    @keyframes fadeIn {
      to {
        opacity: 1;
      }
    }

    #app-wrapper {
      opacity: 0;
      transition: opacity 1s ease-in;
    }

    #app-wrapper.show {
      opacity: 1;
    }

    .progress-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: .75rem;
      margin-bottom: 0.5rem;
    }

    .progress-header h2 {
      margin: 0;
      font-size: 1rem;
      display: inline-flex;
      gap: .5rem;
      align-items: center;
    }

    .button-group {
      display: flex;
      justify-content: flex-end;
      gap: 1rem;
    }

    .button-group button {
      width: auto;
      min-width: 120px;
    }

    .step-content {
      display: none;
    }

    .step-content.active {
      display: block;
    }

    i[data-lucide] {
      width: 18px;
      height: 18px;
      vertical-align: middle;
    }

    .button-group button i[data-lucide]:first-child {
      margin-right: .25rem;
    }

    .button-group button i[data-lucide]:last-child {
      margin-left: .25rem;
    }

    /* Override Pico's horizontal nav to make it vertical */
    #step-menu {
      display: block !important;
      flex-direction: column !important;
    }

    #step-menu li {
      display: block !important;
      margin: 0 !important;
    }

    #step-menu li a {
      display: block !important;
      padding: 0.5rem 0 !important;
      text-decoration: none !important;
    }

    #step-menu li a[aria-current="step"] {
      font-weight: 600;
    }
  </style>
</head>

<body>
  <main>
    <!-- Splash Screen -->
    <div id="splash">
      <!-- Content will be populated from WAIL script -->
    </div>

    <!-- Main Application Wrapper -->
    <div id="app-wrapper">
      <div class="progress-indicator">
        <div class="container">
          <div class="progress-header">
            <h2 id="step-title"><i data-lucide="map-pin" aria-hidden="true"></i></h2>

            <!-- Hamburger menu button -->
            <button id="step-menu-btn" class="secondary" style="padding: 0.5rem;" disabled>
              <i data-lucide="menu" aria-hidden="true"></i>
            </button>
          </div>

          <progress id="interactive-progress" value="1" max="1" aria-valuetext=""></progress>
        </div>
      </div>

      <div class="container" id="main-content"></div>

      <div class="container">
        <div class="button-group">
          <button id="back-btn" class="secondary back-btn" disabled>
            <i data-lucide="arrow-left"></i>
            Back
          </button>
          <button id="next-btn" disabled>
            Next
            <i data-lucide="arrow-right"></i>
          </button>
        </div>
      </div>


      <!-- Aux content dialog (renders Help/About/Settings from aux tags) -->
      <dialog id="aux-dialog">
        <article>
          <header>
            <strong id="aux-title"></strong>
            <button id="aux-close" aria-label="Close" class="close"></button>
          </header>
          <div id="aux-content"></div>
          <footer>
            <button id="aux-ok" class="secondary">Close</button>
          </footer>
        </article>
      </dialog>

      <!-- Step Navigation Dialog -->
      <dialog id="step-menu-dialog">
        <article>
          <header>
            <strong>Navigation</strong>
            <button id="step-menu-close" aria-label="Close" class="close"></button>
          </header>
          <div id="step-menu-content">
            <nav>
              <ul id="step-menu"></ul>
            </nav>
          </div>
          <footer>
            <button id="step-menu-ok" class="secondary">Close</button>
          </footer>
        </article>
      </dialog>

      <!-- Database Inspector Dialog (Developer Tool) -->
      <dialog id="database-dialog">
        <article>
          <header>
            <strong>Database Inspector</strong>
            <small style="color: #666; font-weight: normal;">Developer Tool</small>
            <button id="db-close" aria-label="Close" class="close"></button>
          </header>
          <div id="db-content">
            <div id="db-controls" style="margin-bottom: 1rem;">
              <button id="refresh-db" class="secondary">
                <i data-lucide="refresh-cw"></i>
                Refresh
              </button>
              <button id="clear-db" class="secondary" style="margin-left: 0.5rem;">
                <i data-lucide="trash-2"></i>
                Clear All
              </button>
            </div>
            <div id="db-records">
              <p>Loading records...</p>
            </div>
          </div>
          <footer>
            <button id="db-ok" class="secondary">Close</button>
          </footer>
        </article>
      </dialog>

      <!-- WAIL Script -->
      <script type="wail">
<meta-data>

# {title}

</mark>

<form>
  <label>Groq API Key (required)
    <input type="password" name="groq-api-key" placeholder="Enter your Groq API key (starts with gsk_)..." />

    Validate API Key
  </button>

</splash>

<!-- AUX TAGS (NOT counted as wizard steps) -->
<help>
# Help

- Use **Next** and **Back** to move between steps.
- Your inputs are saved as you type.
- Use the **Steps** dropdown to jump directly.
_Current: step {currentStep} of {totalSteps}._
</help>

</about>

<settings>

</settings>



  </script>

      <script>
        // -------------------------------
        // Parser for WAIL format (with AUX tags)
        // -------------------------------
        class WailParser {
          parse(scriptContent) {
            const sections = this.splitIntoSections(scriptContent);
            const legacyData = this.parseData(sections.DATA || '');
            const tagData = this.parseDataTags(scriptContent);

            // Merge legacy data and tag data, with tag data taking precedence
            const mergedData = { ...legacyData, ...tagData };

            // Parse metadata from tag first, fall back to legacy format
            const tagMetadata = this.parseMetaDataTag(scriptContent);
            const legacyMetadata = this.parseKeyValue(sections.METADATA || '');
            const mergedMetadata = { ...legacyMetadata, ...tagMetadata };

            return {
              metadata: mergedMetadata,
              aiGenerated: this.parseAIGeneratedTags(scriptContent),
              views: this.parseViews(scriptContent), // parse from the whole source, not just VIEWS section
              data: mergedData,
              aux: this.parseAux(scriptContent), // parse from the whole source, not just sections
              splash: this.parseSplash(scriptContent) // parse splash tag separately
            };
          }
          splitIntoSections(content) {
            const sections = {};
            const sectionRegex = /^([A-Z\-]+)\s*$/gm;
            const parts = content.split(sectionRegex).filter(s => s.trim());
            for (let i = 0; i < parts.length; i += 2) {
              if (parts[i] && parts[i + 1]) sections[parts[i].trim()] = parts[i + 1].trim();
            }
            return sections;
          }
          parseKeyValue(content) {
            const result = {};
            const lines = content.split('\n');
            for (const line of lines) {
              const match = line.match(/^([^:]+):\s*(.+)$/);
              if (match) result[match[1].trim()] = match[2].trim();
            }
            return result;
          }
          parseViews(content) {
            console.log('Parsing views from content:', content.substring(0, 200) + '...');
            const views = {};
            const viewRegex = /<view name="([^"]+)">([\s\S]*?)<\/view>/g;
            let match;
            while ((match = viewRegex.exec(content)) !== null) {
              console.log(`Parsed view: ${match[1]}`);
              console.log(`View content: ${match[2].trim()}`);
              views[match[1]] = { name: match[1], content: match[2].trim() };
            }
            console.log('All parsed views:', views);
            return views;
          }
          parseData(content) {
            const result = {};
            const lines = content.split('\n');
            let currentKey = null;
            let currentArray = [];
            for (const line of lines) {
              if (line.match(/^([^:]+):$/)) {
                if (currentKey) result[currentKey] = currentArray;
                currentKey = line.replace(':', '').trim();
                currentArray = [];
              } else if (line.trim().startsWith('-')) {
                currentArray.push(line.trim().substring(1).trim());
              }
            }
            if (currentKey) result[currentKey] = currentArray;
            return result;
          }
          // NEW: parse <data> tags from the full script text
          parseDataTags(fullText) {
            const result = {};
            const dataRegex = /<data name="([^"]+)">([\s\S]*?)<\/data>/gi;
            let match;
            while ((match = dataRegex.exec(fullText)) !== null) {
              const name = match[1];
              const content = match[2].trim();

              console.log(`Parsing data tag: ${name}`, content);

              try {
                // Try to parse as JSON
                const parsed = JSON.parse(content);
                result[name] = parsed;
                console.log(`Successfully parsed ${name} as JSON:`, parsed);
              } catch (error) {
                console.log(`JSON parsing failed for ${name}, falling back to line parsing:`, error.message);
                // If JSON parsing fails, fall back to treating as array of lines
                const lines = content.split('\n')
                  .map(line => line.trim())
                  .filter(line => line.length > 0)
                  .map(line => line.replace(/^["']|["']$/g, '')); // Remove quotes if present
                result[name] = lines;
                console.log(`Parsed ${name} as lines:`, lines);
              }
            }
            console.log('All parsed data tags:', result);
            return result;
          }
          // NEW: parse <meta-data> tag from the full script text
          parseMetaDataTag(fullText) {
            const metaDataRegex = /<meta-data>([\s\S]*?)<\/meta-data>/i;
            const match = fullText.match(metaDataRegex);

            if (!match) {
              console.log('No meta-data tag found');
              return {};
            }

            const content = match[1].trim();
            console.log('Parsing meta-data tag:', content);

            try {
              // Try to parse as JSON
              const parsed = JSON.parse(content);
              console.log('Successfully parsed meta-data as JSON:', parsed);
              return parsed;
            } catch (error) {
              console.log('JSON parsing failed for meta-data, falling back to key-value parsing:', error.message);
              // If JSON parsing fails, fall back to key-value parsing
              return this.parseKeyValue(content);
            }
          }
          // NEW: parse <help>, <about>, <settings> from the full script text
          parseAux(fullText) {
            const tag = (name) => {
              const re = new RegExp(`<${name}>([\\s\\S]*?)<\\/${name}>`, 'i');
              const m = fullText.match(re);
              return m ? m[1].trim() : '';
            };
            return {
              help: tag('help'),
              about: tag('about'),
              settings: tag('settings')
            };
          }
          // NEW: parse <splash> tag separately from views
          parseSplash(fullText) {
            const re = /<splash>([\s\S]*?)<\/splash>/i;
            const m = fullText.match(re);
            return m ? m[1].trim() : '';
          }
          // NEW: parse <ai-generated> tags from the full script text
          parseAIGeneratedTags(fullText) {
            const result = {};
            const aiGeneratedRegex = /<ai-generated name="([^"]+)">([\s\S]*?)<\/ai-generated>/gi;
            let match;
            while ((match = aiGeneratedRegex.exec(fullText)) !== null) {
              const name = match[1];
              const content = match[2].trim();

              console.log(`Parsing ai-generated tag: ${name}`, content);
              result[name] = content;
            }

            // If no ai-generated tags found, try legacy AI-GENERATED section
            if (Object.keys(result).length === 0) {
              const sections = this.splitIntoSections(fullText);
              const aiGeneratedContent = sections['AI-GENERATED'] || '';

              if (aiGeneratedContent.trim()) {
                return this.parseKeyValue(aiGeneratedContent);
              }
            }

            // Fallback to hardcoded values if parsing fails
            if (Object.keys(result).length === 0) {
              return {
                'ai-selected-city': 'randomly select one city from {cities}',
                'ai-evaluation': 'evaluate {city-facts} for accuracy and completeness',
                'ai-grade': 'assign only a single letter grade A, B, C, D, or F',
                'ai-funfact': 'generate interesting fact about {ai-selected-city}'
              };
            }

            console.log('All parsed ai-generated tags:', result);
            return result;
          }
        }

        // -------------------------------
        // Application state
        // -------------------------------
        let parsedScript = null;
        let currentStep = 1;
        let formData = {};
        let aiData = {};
        let stepsCache = null;
        let isSelectingCity = false;

        // Initialize Notyf for toast notifications
        const notyf = new Notyf({
          duration: 4000,
          position: {
            x: 'right',
            y: 'top',
          }
        });

        // -------------------------------
        // Dexie Database
        // -------------------------------
        const db = new Dexie('AIWebScriptDB');
        db.version(1).stores({
          records: '++id, created, updated, user, data'
        });

        // Initialize database
        db.open().catch(err => {
          console.error('Failed to open database:', err);
        });

        // Save function to store the entire adjacent object to Dexie
        async function saveToDatabase() {
          try {
            const now = new Date().toISOString();
            const record = {
              created: now,
              updated: now,
              user: 'current-user', // Placeholder for future user system
              data: {
                formData: { ...formData },
                aiData: { ...aiData },
                currentStep: currentStep,
                timestamp: now
              }
            };

            const id = await db.records.add(record);
            console.log('Record saved to database with ID:', id);

            // Show success feedback
            notyf.success(`Record saved successfully! ID: ${id}`);

            return id;
          } catch (error) {
            console.error('Failed to save to database:', error);
            notyf.error('Failed to save record: ' + error.message);
            throw error;
          }
        }

        // Function to retrieve all records from the database
        async function getAllRecords() {
          try {
            const records = await db.records.orderBy('created').reverse().toArray();
            return records;
          } catch (error) {
            console.error('Failed to retrieve records:', error);
            return [];
          }
        }

        // Function to clear all records from the database
        async function clearAllRecords() {
          try {
            await db.records.clear();
            console.log('All records cleared from database');
            return true;
          } catch (error) {
            console.error('Failed to clear records:', error);
            return false;
          }
        }

        // Function to display records in the database dialog
        async function displayRecords() {
          const recordsContainer = document.getElementById('db-records');
          const records = await getAllRecords();

          if (records.length === 0) {
            recordsContainer.innerHTML = '<p><em>No records found in the database.</em></p>';
            return;
          }

          let html = `
          <div style="overflow-x: auto;">
            <table>
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Created</th>
                  <th>Updated</th>
                  <th>User</th>
                  <th>User Name</th>
                  <th>City</th>
                  <th>Grade</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody>
        `;

          records.forEach(record => {
            const createdDate = new Date(record.created).toLocaleString();
            const updatedDate = new Date(record.updated).toLocaleString();
            const userName = record.data?.formData?.['user-name'] || 'N/A';
            const city = record.data?.aiData?.['ai-selected-city'] || 'N/A';
            const grade = record.data?.aiData?.['ai-grade'] || 'N/A';

            html += `
            <tr>
              <td>${record.id}</td>
              <td>${createdDate}</td>
              <td>${updatedDate}</td>
              <td>${record.user}</td>
              <td>${userName}</td>
              <td>${city}</td>
              <td>${grade}</td>
              <td>
                <button class="secondary" onclick="viewRecordDetails(${record.id})" style="padding: 0.25rem 0.5rem; font-size: 0.8rem;">
                  <i data-lucide="eye"></i>
                  View
                </button>
              </td>
            </tr>
          `;
          });

          html += `
              </tbody>
            </table>
          </div>
        `;

          recordsContainer.innerHTML = html;
          refreshIcons();
        }

        // Function to view detailed record information
        async function viewRecordDetails(recordId) {
          try {
            const record = await db.records.get(recordId);
            if (!record) {
              notyf.error('Record not found');
              return;
            }

            // Create a new dialog for record details
            const detailsDialog = document.createElement('dialog');
            detailsDialog.innerHTML = `
            <article>
              <header>
                <strong>Record Details - ID: ${record.id}</strong>
                <button id="details-close" aria-label="Close" class="close"></button>
              </header>
              <div>
                <p><strong>Created:</strong> ${new Date(record.created).toLocaleString()}</p>
                <p><strong>Updated:</strong> ${new Date(record.updated).toLocaleString()}</p>
                <p><strong>User:</strong> ${record.user}</p>
                
                <h4>Complete Record Data (JSON):</h4>
                <pre style="background: #f5f5f5; padding: 1rem; border-radius: 4px; overflow-x: auto; max-height: 400px; overflow-y: auto;">${JSON.stringify(record, null, 2)}</pre>
              </div>
              <footer>
                <button id="details-ok" class="secondary">Close</button>
              </footer>
            </article>
          `;

            document.body.appendChild(detailsDialog);
            detailsDialog.showModal();

            // Add event listeners for the details dialog
            detailsDialog.querySelector('#details-close').addEventListener('click', () => {
              detailsDialog.close();
              document.body.removeChild(detailsDialog);
            });

            detailsDialog.querySelector('#details-ok').addEventListener('click', () => {
              detailsDialog.close();
              document.body.removeChild(detailsDialog);
            });

            detailsDialog.addEventListener('cancel', (e) => {
              e.preventDefault();
              detailsDialog.close();
              document.body.removeChild(detailsDialog);
            });

          } catch (error) {
            console.error('Failed to retrieve record details:', error);
            notyf.error('Failed to retrieve record details: ' + error.message);
          }
        }

        // -------------------------------
        // Helpers
        // -------------------------------
        function refreshIcons() {
          if (window.lucide && typeof lucide.createIcons === 'function') {
            lucide.createIcons();
          }
        }

        function buildSteps() {
          console.log('Building steps, parsedScript.views:', parsedScript.views);
          const viewNames = Object.keys(parsedScript.views || {});
          console.log('View names found:', viewNames);

          // All views are wizard steps since splash is now a separate tag
          const steps = viewNames.map((name, index) => ({
            id: index + 1,
            name: name.charAt(0).toUpperCase() + name.slice(1),
            viewName: name
          }));

          console.log('Built steps:', steps);
          return steps;
        }

        function getSteps(force = false) {
          if (force || !stepsCache) stepsCache = buildSteps();
          return stepsCache;
        }

        function restoreFormValues(root = document) {
          const fields = root.querySelectorAll('input[name], textarea[name], select[name]');
          fields.forEach(el => {
            if (el.name in formData) el.value = formData[el.name];
          });
        }

        // Aux modals
        function openAuxFromTag(tagName) {
          const content = (parsedScript.aux?.[tagName] || '').trim();
          if (!content) return;
          // Inject step vars before interpolation
          const steps = getSteps();
          const withStepVars = content
            .replace(/\{currentStep\}/g, String(currentStep))
            .replace(/\{totalSteps\}/g, String(steps.length));
          const html = marked.parse(interpolateVariables(withStepVars));
          document.getElementById('aux-title').textContent =
            tagName.charAt(0).toUpperCase() + tagName.slice(1);
          document.getElementById('aux-content').innerHTML = html;
          document.getElementById('aux-dialog').showModal();
          refreshIcons();
        }
        function closeStepMenuDialog() {
          document.getElementById('step-menu-dialog').close();
        }

        function closeAux() {
          document.getElementById('aux-dialog').close();
        }

        // Database dialog functions
        function openDatabaseDialog() {
          const dialog = document.getElementById('database-dialog');
          dialog.showModal();

        // API key validation with connectivity test
        async function validateAPIKey(apiKey) {
          if (!apiKey || !apiKey.trim()) {
            return { valid: false, error: 'No API key provided' };
          }

          // Basic format validation
          if (!apiKey.startsWith('gsk_')) {
            return { valid: false, error: 'Invalid API key format. Groq API keys should start with "gsk_". Please check you\'re using a Groq API key (not xAI Grok API key) from console.groq.com' };
          }

          if (apiKey.length < 40) {
            return { valid: false, error: 'API key appears too short. Groq API keys are typically around 50 characters long.' };
          }

          // Test connectivity with a simple request
          try {
            const testResponse = await fetch('https://api.groq.com/openai/v1/chat/completions', {
              method: 'POST',
              headers: {
                'Authorization': `Bearer ${apiKey}`,
                'Content-Type': 'application/json',
              },
              body: JSON.stringify({
                model: 'llama-3.1-8b-instant',
                messages: [{ role: 'user', content: 'Hello' }],
                max_tokens: 5
              })
            });

            if (!testResponse.ok) {
              if (testResponse.status === 401) {
                return { valid: false, error: 'Authentication failed. Please check your Groq API key is valid and active. Get a free key at console.groq.com' };
              } else if (testResponse.status === 429) {
                return { valid: false, error: 'Rate limit exceeded. Please wait a moment and try again, or upgrade your Groq plan.' };
              } else {
                const errorText = await testResponse.text();
                return { valid: false, error: `API error: ${testResponse.status} ${testResponse.statusText} - ${errorText}` };
              }
            }

            return { valid: true };
          } catch (error) {
            return { valid: false, error: `Connection error: ${error.message}. Please check your internet connection and try again.` };
          }
        }

        // Groq API implementation
        async function generateWithGroqAPI(apiKey) {
          console.log('generateWithGroqAPI called');
          console.log('parsedScript.aiGenerated:', parsedScript.aiGenerated);
          console.log('Current aiData:', aiData);

          // Get all AI variables that need to be generated (excluding those already set)
          const aiVariables = Object.keys(parsedScript.aiGenerated || {});
          const variablesToGenerate = aiVariables.filter(key => !aiData[key]);

          console.log('All AI variables:', aiVariables);
          console.log('Variables to generate:', variablesToGenerate);

          if (variablesToGenerate.length === 0) {
            console.log('No AI variables need generation');
            return;
          }

          // Build dynamic prompt based on AI-GENERATED section
          const promptInstructions = variablesToGenerate.map(key => {
            const instruction = parsedScript.aiGenerated[key];
            return `- ${key}: ${instruction}`;
          }).join('\n');

          // Get context variables for the prompt
          const city = aiData['ai-selected-city'];
          const userFacts = formData['city-facts'] || '';

          // Prepare the dynamic prompt
          const evaluationPrompt = `You are an expert geography teacher. Evaluate the following facts about ${city} provided by a student:

Student's facts: "${userFacts}"

Please provide the following information:
${promptInstructions}

IMPORTANT: For the ai-grade field, respond with ONLY a single letter: A, B, C, D, or F. Do not include any explanation or additional text.

Respond with a JSON object containing these exact keys: ${variablesToGenerate.map(key => `"${key}"`).join(', ')}. Each value should be a single string.`;

          console.log('=== API CALL DEBUG ===');
          console.log('City:', city);
          console.log('User facts:', userFacts);
          console.log('Prompt instructions:', promptInstructions);
          console.log('Full prompt:', evaluationPrompt);
          console.log('Variables to generate:', variablesToGenerate);

          // Try different models in order of preference
          const models = ['llama-3.1-8b-instant', 'llama-3.1-70b-versatile', 'llama-3-8b-8192'];

          for (const model of models) {
            try {
              const requestBody = {
                model: model,
                messages: [
                  {
                    role: 'system',
                    content: 'You are a helpful assistant that responds in JSON format.'
                  },
                  {
                    role: 'user',
                    content: evaluationPrompt
                  }
                ],
                temperature: 0.7,
                max_tokens: 500,
                response_format: { type: "json_object" }
              };

              console.log(`Trying Groq API with model: ${model}`, {
                url: 'https://api.groq.com/openai/v1/chat/completions',
                headers: {
                  'Authorization': `Bearer ${apiKey.substring(0, 10)}...`,
                  'Content-Type': 'application/json',
                },
                body: requestBody
              });

              const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                method: 'POST',
                headers: {
                  'Authorization': `Bearer ${apiKey}`,
                  'Content-Type': 'application/json',
                },
                body: JSON.stringify(requestBody)
              });

              console.log(`Groq API Response Status for ${model}:`, response.status, response.statusText);

              if (!response.ok) {
                const errorText = await response.text();
                console.error(`Groq API Error Response for ${model}:`, errorText);

                // Provide user-friendly error messages
                let userMessage = '';
                if (response.status === 401) {
                  userMessage = 'Authentication failed. Please check your Groq API key is valid and active. Get a free key at console.groq.com';
                } else if (response.status === 429) {
                  userMessage = 'Rate limit exceeded. Please wait a moment and try again, or upgrade your Groq plan.';
                } else if (response.status === 400) {
                  userMessage = 'Bad request. Please ensure you\'re using a valid Groq API key from console.groq.com';
                } else {
                  userMessage = `API error: ${response.status} ${response.statusText} - ${errorText}`;
                }

                // If this is the last model, throw the error
                if (model === models[models.length - 1]) {
                  throw new Error(userMessage);
                }
                // Otherwise, try the next model
                continue;
              }

              const data = await response.json();
              console.log(`Groq API Success Response for ${model}:`, data);

              if (!data.choices || !data.choices[0] || !data.choices[0].message) {
                throw new Error('Invalid response format from Groq API');
              }

              const aiResponse = data.choices[0].message.content;
              console.log('Raw AI response:', aiResponse);

              // Parse the JSON response (guaranteed to be valid JSON with response_format)
              let parsed;
              try {
                parsed = JSON.parse(aiResponse);
                console.log('Parsed JSON successfully:', parsed);
              } catch (parseError) {
                console.error('Failed to parse JSON response:', parseError);
                console.error('Raw response was:', aiResponse);
                throw new Error(`Failed to parse AI response as JSON: ${parseError.message}`);
              }

              console.log('Variables to generate:', variablesToGenerate);
              console.log('Raw response values:', variablesToGenerate.map(key => ({ key, value: parsed[key], type: typeof parsed[key] })));

              // Dynamically assign all AI variables from the response
              variablesToGenerate.forEach(key => {
                const value = parsed[key];
                if (value === undefined || value === null) {
                  aiData[key] = `${key} not provided`;
                } else if (Array.isArray(value)) {
                  // Handle arrays - convert to readable format
                  aiData[key] = value.map(item =>
                    typeof item === 'object' ? JSON.stringify(item) : String(item)
                  ).join('\n');
                } else if (typeof value === 'object') {
                  // Handle objects - convert to readable format
                  aiData[key] = JSON.stringify(value, null, 2);
                } else {
                  // Handle strings, numbers, etc.
                  let processedValue = String(value);

                  // Special processing for ai-grade: extract only the letter grade
                  if (key === 'ai-grade') {
                    const gradeMatch = processedValue.match(/[ABCDEF]/i);
                    if (gradeMatch) {
                      processedValue = gradeMatch[0].toUpperCase();
                    } else {
                      processedValue = 'N/A';
                    }
                  }

                  aiData[key] = processedValue;
                }
              });

              console.log('Set aiData:', aiData);
              console.log('AI data keys:', Object.keys(aiData));
              console.log('AI data values:', Object.values(aiData));

              // Success! Break out of the model loop
              return;

            } catch (error) {
              console.error(`Error with model ${model}:`, error);
              // If this is the last model, re-throw the error
              if (model === models[models.length - 1]) {
                throw error;
              }
              // Otherwise, try the next model
              continue;
            }
          }
        }


        // -------------------------------
        // Rendering
        // -------------------------------
        function interpolateVariables(content) {
          let result = content;

          // Metadata
          for (const [key, value] of Object.entries(parsedScript.metadata))
            result = result.replace(new RegExp(`\\{${key}\\}`, 'g'), value);

          // Data (arrays -> simple numbered text list)
          for (const [key, value] of Object.entries(parsedScript.data)) {
            if (Array.isArray(value)) {
              const listText = value.map((item, i) => `${i + 1}. ${item}`).join('\n');
              result = result.replace(new RegExp(`\\{${key}\\}`, 'g'), listText);
            } else {
              result = result.replace(new RegExp(`\\{${key}\\}`, 'g'), value);
            }
          }

          // AI-generated variables
          console.log('aiData:', aiData);
          for (const [key, value] of Object.entries(aiData)) {
            if (value !== undefined && value !== null) {
              result = result.replace(new RegExp(`\\{${key}\\}`, 'g'), String(value));
              console.log(`Replaced {${key}} with:`, value);
            }
          }

          // Handle missing AI variables with loading placeholders or fallback values
          const aiVariablePattern = /\{ai-[^}]+\}/g;
          const missingAIVars = result.match(aiVariablePattern);
          if (missingAIVars) {
            missingAIVars.forEach(varName => {
              const cleanVarName = varName.slice(1, -1); // Remove { and }
              if (!aiData[cleanVarName]) {
                // Provide fallback values for common AI variables
                let fallbackValue = `${cleanVarName} (generating...)`;

                if (cleanVarName === 'ai-evaluation') {
                  fallbackValue = 'AI evaluation is being generated...';
                } else if (cleanVarName === 'ai-grade') {
                  fallbackValue = 'Grade: Generating...';
                } else if (cleanVarName === 'ai-funfact') {
                  fallbackValue = 'Fun fact is being generated...';
                }

                result = result.replace(new RegExp(`\\${varName}`, 'g'), fallbackValue);
                console.log(`Replaced ${varName} with fallback: ${fallbackValue}`);
              }
            });
          }

          // Form data
          for (const [key, value] of Object.entries(formData))
            result = result.replace(new RegExp(`\\{${key}\\}`, 'g'), value || '[not provided]');

          return result;
        }

        async function nextStep() {
          // Prevent navigation if city selection is in progress
          if (isSelectingCity) {
            console.log('City selection in progress, please wait...');
            return;
          }

          const steps = getSteps();
          if (currentStep < steps.length) await goToStep(currentStep + 1);
        }

        // -------------------------------
        // UI update
        // -------------------------------
        function updateUI() {
          const steps = getSteps();
          const maxSteps = steps.length;
          const currentStepData = steps[currentStep - 1];

          // Defensive check - if no steps or current step data is undefined, don't update UI
          if (!steps || steps.length === 0 || !currentStepData) {
            console.error('No steps available or current step data is undefined:', { steps, currentStep, currentStepData });
            return;
          }

          const progressEl = document.getElementById('interactive-progress');
          progressEl.value = currentStep;
          progressEl.max = maxSteps;
          progressEl.setAttribute('aria-valuetext', `Step ${currentStep} of ${maxSteps}`);

          // Title text (preserve icon)
          const stepTitle = document.getElementById('step-title');
          const titleIcon = stepTitle.querySelector('i[data-lucide]');
          stepTitle.textContent = `${currentStep}. ${currentStepData.name}`;
          if (titleIcon) stepTitle.prepend(titleIcon);

          // Show active step content
          document.querySelectorAll('.step-content').forEach(article => {
            const stepId = parseInt(article.dataset.step, 10);
            article.classList.toggle('active', stepId === currentStep);
          });

          // Highlight current item in dropdown
          document.querySelectorAll('#step-menu a[data-step]').forEach(a => {
            const stepId = parseInt(a.dataset.step, 10);
            a.toggleAttribute('aria-current', stepId === currentStep);
          });

          // Simple button state management
          const backBtn = document.getElementById('back-btn');
          const nextBtn = document.getElementById('next-btn');
          const hamburgerBtn = document.getElementById('step-menu-btn');

          if (!backBtn || !nextBtn || !hamburgerBtn) return; // Exit if buttons don't exist yet

          // Back button: disabled on step 1, enabled on other steps
          backBtn.disabled = currentStep === 1;

          // Next button: disabled on last step or when selecting city
          nextBtn.disabled = currentStep === maxSteps || isSelectingCity;

          // Hamburger menu: always enabled (API key is validated before entering main app)
          hamburgerBtn.disabled = false;

          // Update Next button text when city selection is in progress
          if (isSelectingCity && currentStep === 1) {
            nextBtn.innerHTML = 'Selecting city... <i data-lucide="loader-2"></i>';
          } else {
            nextBtn.innerHTML = 'Next <i data-lucide="arrow-right"></i>';
          }

          // Ensure icons are refreshed after DOM updates
          refreshIcons();
        }

        // -------------------------------
        // Start the application
        // -------------------------------
        // Initialize splash screen first
        initSplashScreen();

        // Initialize main app after splash
        setTimeout(() => {
          init();
        }, 100); // Small delay to ensure splash is set up
      </script>
    </div> <!-- End app-wrapper -->
  </main>
</body>
