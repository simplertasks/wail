  <style>
    /* Splash Screen Styles */
    #splash {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100vh;
      background-color: var(--pico-background-color);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      opacity: 1;
      transition: opacity 1s ease-out;
    }

    #splash .container {
      text-align: center;
    }

    #splash.fade-out {
      opacity: 0;
      pointer-events: none;
    }

    #splash h1,
    #splash h2,
    #splash h3 {
      animation: fadeIn 1s ease-in forwards;
      margin-bottom: 1rem;
      opacity: 0;
    }

    #splash p,
    #splash mark,
    #splash form {
      animation: fadeIn 1s ease-in 0.3s forwards;
      opacity: 0;
      margin: 0 auto;
    }

    #splash img {
      animation: fadeIn 1s ease-in 0.6s forwards;
      opacity: 0;
      display: block;
      margin: 0 auto;
      max-width: 100%;
      height: auto;
    }

    @keyframes fadeIn {
      to {
        opacity: 1;
      }
    }

    #app-wrapper {
      opacity: 0;
      transition: opacity 1s ease-in;
    }

    #app-wrapper.show {
      opacity: 1;
    }

    .progress-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: .75rem;
      margin-bottom: 0.5rem;
    }

    .progress-header h2 {
      margin: 0;
      font-size: 1rem;
      display: inline-flex;
      gap: .5rem;
      align-items: center;
    }

    .button-group {
      display: flex;
      justify-content: flex-end;
      gap: 1rem;
    }

    .button-group button {
      width: auto;
      min-width: 120px;
    }

    .step-content {
      display: none;
    }

    .step-content.active {
      display: block;
    }

    i[data-lucide] {
      width: 18px;
      height: 18px;
      vertical-align: middle;
    }

    .button-group button i[data-lucide]:first-child {
      margin-right: .25rem;
    }

    .button-group button i[data-lucide]:last-child {
      margin-left: .25rem;
    }

    /* Override Pico's horizontal nav to make it vertical */
    #step-menu {
      display: block !important;
      flex-direction: column !important;
    }

    #step-menu li {
      display: block !important;
      margin: 0 !important;
    }

    #step-menu li a {
      display: block !important;
      padding: 0.5rem 0 !important;
      text-decoration: none !important;
    }

    #step-menu li a[aria-current="step"] {
      font-weight: 600;
    }
  </style>
</head>

      <!-- WAIL Script -->
      <script type="wail">

  </script>

      <script>
        // -------------------------------
        // Parser for WAIL format (with AUX tags)
        // -------------------------------
        class WailParser {
          constructor() {
            // Cache regex patterns for better performance
            this.regexCache = {
              data: /<data name="([^"]+)">([\s\S]*?)<\/data>/gi,
              metaData: /<meta-data>([\s\S]*?)<\/meta-data>/i,
              views: /<view name="([^"]+)"(?:\s+[^>]*)?>([\s\S]*?)<\/view>/g,
              aiGenerated: /<ai-generated>([\s\S]*?)<\/ai-generated>/i,
              aiGeneratedLegacy: /<ai-generated name="([^"]+)">([\s\S]*?)<\/ai-generated>/gi,
              splash: /<splash>([\s\S]*?)<\/splash>/i,
              aux: (name) => new RegExp(`<${name}>([\\s\\S]*?)<\\/${name}>`, 'i')
            };
          }

          parse(scriptContent) {
            const tagData = this.parseDataTags(scriptContent);

            // Parse metadata from tag
            const tagMetadata = this.parseMetaDataTag(scriptContent);

            return {
              metadata: tagMetadata,
              aiGenerated: this.parseAIGeneratedTags(scriptContent),
              views: this.parseViews(scriptContent),
              data: tagData,
              aux: this.parseAux(scriptContent),
              splash: this.parseSplash(scriptContent)
            };
          }
          parseKeyValue(content) {
            const result = {};
            const lines = content.split('\n');
            for (const line of lines) {
              const match = line.match(/^([^:]+):\s*(.+)$/);
              if (match) result[match[1].trim()] = match[2].trim();
            }
            return result;
          }
          parseViews(content) {
            const views = {};
            const viewRegex = this.regexCache.views;
            viewRegex.lastIndex = 0; // Reset regex state
            let match;
            while ((match = viewRegex.exec(content)) !== null) {
              const viewName = match[1];
              const viewContent = match[2].trim();

              // Extract type attribute from the opening tag
              const typeMatch = content.match(new RegExp(`<view\\s+name="${viewName}"(?:\\s+type="([^"]+)")?`, 'i'));
              const viewType = typeMatch ? typeMatch[1] : null;

              views[viewName] = {
                name: viewName,
                content: viewContent,
                type: viewType
              };
            }
            return views;
          }
          // NEW: parse <data> tags from the full script text
          parseDataTags(fullText) {
            const result = {};
            const dataRegex = this.regexCache.data;
            dataRegex.lastIndex = 0; // Reset regex state
            let match;
            while ((match = dataRegex.exec(fullText)) !== null) {
              const name = match[1];
              const content = match[2].trim();

              try {
                // Try to parse as JSON
                const parsed = JSON.parse(content);
                result[name] = parsed;
              } catch (error) {
                // If JSON parsing fails, fall back to treating as array of lines
                const lines = content.split('\n')
                  .map(line => line.trim())
                  .filter(line => line.length > 0)
                  .map(line => line.replace(/^["']|["']$/g, '')); // Remove quotes if present
                result[name] = lines;
              }
            }
            return result;
          }
          // NEW: parse <meta-data> tag from the full script text
          parseMetaDataTag(fullText) {
            const match = fullText.match(this.regexCache.metaData);

            if (!match) {
              return {};
            }

            const content = match[1].trim();

            try {
              // Try to parse as JSON
              const parsed = JSON.parse(content);
              return parsed;
            } catch (error) {
              // If JSON parsing fails, fall back to key-value parsing
              return this.parseKeyValue(content);
            }
          }
          // NEW: parse <help>, <about>, <settings> from the full script text
          parseAux(fullText) {
            const tag = (name) => {
              const re = this.regexCache.aux(name);
              const m = fullText.match(re);
              return m ? m[1].trim() : '';
            };
            return {
              help: tag('help'),
              about: tag('about'),
              settings: tag('settings')
            };
          }
          // NEW: parse <splash> tag separately from views
          parseSplash(fullText) {
            const m = fullText.match(this.regexCache.splash);
            return m ? m[1].trim() : '';
          }
          // NEW: parse <ai-generated> tags from the full script text
          parseAIGeneratedTags(fullText) {
            // First try to parse as JSON format (new format)
            const match = fullText.match(this.regexCache.aiGenerated);

            if (match) {
              const content = match[1].trim();
              try {
                // Try to parse as JSON
                const parsed = JSON.parse(content);
                return parsed;
              } catch (error) {
                // If JSON parsing fails, fall back to key-value parsing
                return this.parseKeyValue(content);
              }
            }

            // If no JSON format found, try legacy individual tags format
            const result = {};
            const legacyAiGeneratedRegex = this.regexCache.aiGeneratedLegacy;
            legacyAiGeneratedRegex.lastIndex = 0; // Reset regex state
            let legacyMatch;
            while ((legacyMatch = legacyAiGeneratedRegex.exec(fullText)) !== null) {
              const name = legacyMatch[1];
              const content = legacyMatch[2].trim();
              result[name] = content;
            }

            // If legacy tags found, return them
            if (Object.keys(result).length > 0) {
              return result;
            }

            // Fallback to hardcoded values if parsing fails
            return {
              'ai-selected-city': 'randomly select one city from {cities}',
              'ai-evaluation': 'evaluate {city-facts} for accuracy and completeness',
              'ai-grade': 'assign only a single letter grade A, B, C, D, or F',
              'ai-funfact': 'generate interesting fact about {ai-selected-city}'
            };
          }
        }

        // -------------------------------
        // Application state
        // -------------------------------
        let parsedScript = null;
        let currentStep = 1;
        let formData = {};
        let aiData = {};
        let stepsCache = null;
        let aiDataCache = {}; // Smart caching for AI responses
        let dataTable = null; // Simple-DataTables instance
        let userResultsTable = null; // User results table instance

        // Cache frequently accessed DOM elements
        const domCache = {
          elements: {},
          get(id) {
            if (!this.elements[id]) {
              this.elements[id] = document.getElementById(id);
            }
            return this.elements[id];
          },
          clear() {
            this.elements = {};
          }
        };

        // Initialize Notyf for toast notifications
        const notyf = new Notyf({
          duration: 4000,
          position: {
            x: 'right',
            y: 'top',
          }
        });

        // -------------------------------
        // Dexie Database
        // -------------------------------
        // Database name will be set dynamically based on app metadata
        let db = null;

        // Function to initialize database with dynamic name
        function initializeDatabase(parsedScript) {
          if (db) {
            // Close existing database if it exists
            db.close();
          }

          // Create database name from data tag names, fallback to 'wail-app'
          const dataNames = Object.keys(parsedScript.data || {});
          const primaryDataName = dataNames.length > 0 ? dataNames[0] : 'app';
          const dbName = `wail-${primaryDataName}`;

          db = new Dexie(dbName);
          db.version(1).stores({
            records: '++id, created, updated, user, data'
          });

          // Initialize database
          db.open().catch(err => {
            console.error('Failed to open database:', err);
          });

          console.log(`Database initialized: ${dbName}`);
        }

        // Save function to store the entire adjacent object to Dexie
        async function saveToDatabase() {
          try {
            const now = new Date().toISOString();
            const record = {
              created: now,
              updated: now,
              user: 'current-user', // Placeholder for future user system
              data: {
                formData: { ...formData },
                aiData: { ...aiData },
                currentStep: currentStep,
                timestamp: now
              }
            };

            const id = await db.records.add(record);

            // Show success feedback
            notyf.success(`Record saved successfully! ID: ${id}`);

            // Refresh both tables
            console.log('Refreshing tables after save...');
            initializeDatabaseTable();
            initializeUserResultsTable();

            return id;
          } catch (error) {
            console.error('Failed to save to database:', error);
            notyf.error('Failed to save record: ' + error.message);
            throw error;
          }
        }

        // Function to retrieve all records from the database
        async function getAllRecords() {
          try {
            const records = await db.records.orderBy('created').reverse().toArray();
            return records;
          } catch (error) {
            console.error('Failed to retrieve records:', error);
            return [];
          }
        }

        // Function to clear all records from the database
        async function clearAllRecords() {
          try {
            await db.records.clear();
            return true;
          } catch (error) {
            console.error('Failed to clear records:', error);
            return false;
          }
        }

        // Function to initialize and populate the main database table
        async function initializeDatabaseTable() {
          try {
            console.log('initializeDatabaseTable called');
            const records = await getAllRecords();
            console.log('Retrieved records:', records.length);

            if (records.length === 0) {
              // If no records, destroy existing table if it exists
              if (dataTable) {
                dataTable.destroy();
                dataTable = null;
              }
              const tableBody = document.querySelector('#database-table tbody');
              tableBody.innerHTML = '<tr><td colspan="6" style="text-align: center; font-style: italic;">No records found in the database.</td></tr>';
              return;
            }

            // Prepare data for Simple-DataTables
            const tableData = records.map(record => {
              const createdDate = new Date(record.created).toLocaleString();
              const userName = record.data?.formData?.['user-name'] || 'N/A';
              const city = record.data?.aiData?.['ai-selected-city'] || 'N/A';
              const grade = record.data?.aiData?.['ai-grade'] || 'N/A';

              return [
                record.id,
                createdDate,
                userName,
                city,
                grade,
                `<button class="secondary" onclick="viewRecordDetails(${record.id})" style="padding: 0.25rem 0.5rem; font-size: 0.8rem;">
                  <i data-lucide="eye"></i>
                  View
                </button>`
              ];
            });

            // Initialize or update Simple-DataTables
            if (dataTable) {
              console.log('Updating existing DataTable with new data');
              // Clear existing data and insert all records
              dataTable.destroy();
              dataTable = null;
            }

            if (!dataTable) {
              console.log('Creating new DataTable with', records.length, 'records');

              // Clear the table body first
              const tableBody = document.querySelector('#database-table tbody');
              tableBody.innerHTML = '';

              dataTable = new simpleDatatables.DataTable("#database-table", {
                searchable: true,
                sortable: true,
                paging: true,
                perPage: 10,
                perPageSelect: [5, 10, 15, 20],
                labels: {
                  placeholder: "Search records...",
                  perPage: "Records per page:",
                  noRows: "No records found",
                  info: "Showing {start} to {end} of {rows} records"
                }
              });

              // Insert all the data
              dataTable.insert({ data: tableData });

              console.log('DataTable created and populated successfully');
            }

            // Refresh icons after table is created
            refreshIcons();

            // Ensure the details element is open when new data is added
            const detailsElement = document.querySelector('#database-table-section details');
            if (detailsElement && records.length > 0) {
              detailsElement.open = true;
            }

          } catch (error) {
            console.error('Failed to initialize database table:', error);
            const tableBody = document.querySelector('#database-table tbody');
            tableBody.innerHTML = '<tr><td colspan="6" style="text-align: center; color: red;">Error loading records: ' + error.message + '</td></tr>';
          }
        }

        // Function to initialize and populate the user results table
        async function initializeUserResultsTable() {
          try {
            console.log('initializeUserResultsTable called');
            const records = await getAllRecords();
            console.log('Retrieved records for user table:', records.length);

            if (records.length === 0) {
              if (userResultsTable) {
                userResultsTable.destroy();
                userResultsTable = null;
              }
              const tableBody = document.querySelector('#user-results-table tbody');
              tableBody.innerHTML = '<tr><td colspan="4" style="text-align: center; font-style: italic;">No quiz results yet. Complete the quiz to see your results here!</td></tr>';
              return;
            }

            // Prepare data for user results table (simplified)
            const userTableData = records.map(record => {
              const createdDate = new Date(record.created).toLocaleDateString();
              const city = record.data?.aiData?.['ai-selected-city'] || 'N/A';
              const grade = record.data?.aiData?.['ai-grade'] || 'N/A';

              return [
                createdDate,
                city,
                grade,
                `<button class="secondary" onclick="editUserRecord(${record.id})" style="padding: 0.25rem 0.5rem; font-size: 0.8rem; margin-right: 0.25rem;">
                  <i data-lucide="edit"></i>
                  Edit
                </button>
                <button class="secondary" onclick="viewRecordDetails(${record.id})" style="padding: 0.25rem 0.5rem; font-size: 0.8rem;">
                  <i data-lucide="eye"></i>

        // API key validation with connectivity test
        async function validateAPIKey(apiKey) {
          if (!apiKey || !apiKey.trim()) {
            return { valid: false, error: 'No API key provided' };
          }

          // Basic format validation
          if (!apiKey.startsWith('gsk_')) {
            return { valid: false, error: 'Invalid API key format. Groq API keys should start with "gsk_". Please check you\'re using a Groq API key (not xAI Grok API key) from console.groq.com' };
          }

          if (apiKey.length < 40) {
            return { valid: false, error: 'API key appears too short. Groq API keys are typically around 50 characters long.' };
          }

          // Test connectivity with a simple request
          try {
            const testResponse = await fetch('https://api.groq.com/openai/v1/chat/completions', {
              method: 'POST',
              headers: {
                'Authorization': `Bearer ${apiKey}`,
                'Content-Type': 'application/json',
              },
              body: JSON.stringify({
                model: 'llama-3.1-8b-instant',
                messages: [{ role: 'user', content: 'Hello' }],
                max_tokens: 5
              })
            });

            if (!testResponse.ok) {
              if (testResponse.status === 401) {
                return { valid: false, error: 'Authentication failed. Please check your Groq API key is valid and active. Get a free key at console.groq.com' };
              } else if (testResponse.status === 429) {
                return { valid: false, error: 'Rate limit exceeded. Please wait a moment and try again, or upgrade your Groq plan.' };
              } else {
                const errorText = await testResponse.text();
                return { valid: false, error: `API error: ${testResponse.status} ${testResponse.statusText} - ${errorText}` };
              }
            }

            return { valid: true };
          } catch (error) {
            return { valid: false, error: `Connection error: ${error.message}. Please check your internet connection and try again.` };
          }
        }


        // Generate cache key based on form data and current step
        function getCacheKey() {
          const formDataStr = JSON.stringify(formData);
          const stepStr = String(currentStep);
          return `${formDataStr}-${stepStr}`;
        }

        // AI generation - requires valid API key
        async function generateAIData() {
          const apiKey = formData['groq-api-key'];
          // Validate API key first
          const validation = await validateAPIKey(apiKey);
          if (!validation.valid) {
            throw new Error(validation.error);
          }

          // Check cache first
          const cacheKey = getCacheKey();
          if (aiDataCache[cacheKey]) {
            aiData = { ...aiDataCache[cacheKey] };
            return;
          }

          // Use Groq API
          await generateWithGroqAPI(apiKey);

          // Cache the result
          aiDataCache[cacheKey] = { ...aiData };
        }


        // Extract dependencies from AI instructions
        function extractDependencies(instructions) {
          const dependencies = new Set();
          Object.values(instructions).forEach(instruction => {
            const matches = instruction.match(/\{([^}]+)\}/g);
            if (matches) {
              matches.forEach(match => dependencies.add(match.slice(1, -1)));
            }
          });
          return Array.from(dependencies);
        }

        // Check if a view contains AI-generated variables
        function viewContainsAIVariables(viewContent) {
          if (!parsedScript.aiGenerated) return false;

          const aiVariableNames = Object.keys(parsedScript.aiGenerated);
          return aiVariableNames.some(varName => {
            const regex = new RegExp(`\\{${varName}\\}`, 'g');
            return regex.test(viewContent);
          });
        }

        // Groq API implementation
        async function generateWithGroqAPI(apiKey) {
          // Get all AI variables that need to be generated
          const aiVariables = Object.keys(parsedScript.aiGenerated || {});
          const variablesToGenerate = aiVariables.filter(key => !aiData[key]);

          if (variablesToGenerate.length === 0) {
            return;
          }

          // Build dynamic prompt based on AI-GENERATED section
          const promptInstructions = variablesToGenerate.map(key => {
            const instruction = parsedScript.aiGenerated[key];
            return `- ${key}: ${instruction}`;
          }).join('\n');

          // Debug: Log the actual form data being sent
          console.log('Form data being sent to AI:', formData);
          console.log('AI data being sent to AI:', aiData);

          // Extract dependencies and build context
          const dependencies = extractDependencies(parsedScript.aiGenerated);
          const dependencyText = dependencies.length > 0
            ? `Available variables: ${dependencies.join(', ')}`
            : 'No variables available';

          // Prepare the completely generic prompt
          const evaluationPrompt = `You are a helpful AI assistant.

CRITICAL RULE: Only return an empty string "" if a variable in curly braces {like-this} is completely missing, null, or literally empty. If the variable contains ANY content (even if brief), you should provide a proper response.

${dependencyText}

Please provide the following information:
${promptInstructions}

IMPORTANT: When evaluating user responses, read the ACTUAL text the user provided. Do not make assumptions or evaluate different text than what was given.

Examples:
- If {user-input} is missing/null/empty → respond with "" for that field
- If {user-input} contains "Tokyo is a big city" → provide a specific evaluation of this statement
- If {data} is empty string → respond with "" for that field  
- If {data} contains any text → provide a proper response

Respond with a JSON object containing these exact keys: ${variablesToGenerate.map(key => `"${key}"`).join(', ')}. Each value should be a single string.`;


          // Try different models in order of preference
          const models = ['llama-3.1-8b-instant', 'llama-3.1-70b-versatile', 'llama-3-8b-8192'];

          for (const model of models) {
            try {
              const requestBody = {
                model: model,
                messages: [
                  {
                    role: 'system',
                    content: 'You are a helpful assistant that responds in JSON format.'
                  },
                  {
                    role: 'user',
                    content: evaluationPrompt
                  }
                ],
                temperature: 0.7,
                max_tokens: 500,
                response_format: { type: "json_object" }
              };


              const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                method: 'POST',
                headers: {
                  'Authorization': `Bearer ${apiKey}`,
                  'Content-Type': 'application/json',
                },
                body: JSON.stringify(requestBody)
              });


              if (!response.ok) {
                const errorText = await response.text();
                console.error(`Groq API Error Response for ${model}:`, errorText);

                // Provide user-friendly error messages
                let userMessage = '';
                if (response.status === 401) {
                  userMessage = 'Authentication failed. Please check your Groq API key is valid and active. Get a free key at console.groq.com';
                } else if (response.status === 429) {
                  userMessage = 'Rate limit exceeded. Please wait a moment and try again, or upgrade your Groq plan.';
                } else if (response.status === 400) {
                  userMessage = 'Bad request. Please ensure you\'re using a valid Groq API key from console.groq.com';
                } else {
                  userMessage = `API error: ${response.status} ${response.statusText} - ${errorText}`;
                }

                // If this is the last model, throw the error
                if (model === models[models.length - 1]) {
                  throw new Error(userMessage);
                }
                // Otherwise, try the next model
                continue;
              }

              const data = await response.json();

              if (!data.choices || !data.choices[0] || !data.choices[0].message) {
                throw new Error('Invalid response format from Groq API');
              }

              const aiResponse = data.choices[0].message.content;

              // Parse the JSON response (guaranteed to be valid JSON with response_format)
              let parsed;
              try {
                parsed = JSON.parse(aiResponse);
              } catch (parseError) {
                console.error('Failed to parse JSON response:', parseError);
                console.error('Raw response was:', aiResponse);
                throw new Error(`Failed to parse AI response as JSON: ${parseError.message}`);
              }


              // Dynamically assign all AI variables from the response
              variablesToGenerate.forEach(key => {
                const value = parsed[key];
                if (value === undefined || value === null) {
                  aiData[key] = `${key} not provided`;
                } else if (Array.isArray(value)) {
                  // Handle arrays - convert to readable format
                  aiData[key] = value.map(item =>
                    typeof item === 'object' ? JSON.stringify(item) : String(item)
                  ).join('\n');
                } else if (typeof value === 'object') {
                  // Handle objects - convert to readable format
                  aiData[key] = JSON.stringify(value, null, 2);
                } else {
                  // Handle strings, numbers, etc.
                  let processedValue = String(value);

                  // Check if AI returned explanatory text instead of empty string for missing data
                  const missingDataPatterns = [
                    /incomplete data/i,
                    /cannot evaluate/i,
                    /no data/i,
                    /missing/i,
                    /unavailable/i,
                    /not provided/i,
                    /insufficient/i,
                    /unknown/i,
                    /n\/a/i,
                    /not available/i,
                    /cannot determine/i,
                    /unable to/i
                  ];

                  if (missingDataPatterns.some(pattern => pattern.test(processedValue))) {
                    processedValue = '';
                  }

                  // Clean up any invisible characters, zero-width spaces, or non-breaking spaces
                  processedValue = processedValue
                    .replace(/[\u200B-\u200D\uFEFF]/g, '') // Remove zero-width characters
                    .replace(/\u00A0/g, ' ') // Replace non-breaking spaces with regular spaces
                    .trim();

                  // Special processing for ai-grade: extract only the letter grade
                  if (key === 'ai-grade') {
                    const gradeMatch = processedValue.match(/[ABCDEF]/i);
                    if (gradeMatch) {
                      processedValue = gradeMatch[0].toUpperCase();
                    } else {
                      processedValue = '';
                    }
                  }

                  aiData[key] = processedValue;
                }
              });


              // Success! Break out of the model loop
              return;

            } catch (error) {
              console.error(`Error with model ${model}:`, error);
              // If this is the last model, re-throw the error
              if (model === models[models.length - 1]) {
                throw error;
              }
              // Otherwise, try the next model
              continue;
            }
          }
        }


        // -------------------------------
        // Rendering
        // -------------------------------
        function interpolateVariables(content) {
          let result = content;

          // Metadata
          for (const [key, value] of Object.entries(parsedScript.metadata))
            result = result.replace(new RegExp(`\\{${key}\\}`, 'g'), value);

          // Data (arrays -> simple numbered text list)
          for (const [key, value] of Object.entries(parsedScript.data)) {
            if (Array.isArray(value)) {
              const listText = value.map((item, i) => `${i + 1}. ${item}`).join('\n');
              result = result.replace(new RegExp(`\\{${key}\\}`, 'g'), listText);
            } else {
              result = result.replace(new RegExp(`\\{${key}\\}`, 'g'), value);
            }
          }

          // AI-generated variables
          for (const [key, value] of Object.entries(aiData)) {
            if (value !== undefined && value !== null) {
              // Handle empty strings by replacing with nothing (not even a space)
              let displayValue = value === '' ? '' : String(value);

              // Clean up any invisible characters or whitespace
              if (displayValue === '' || displayValue.trim() === '') {
                displayValue = '';
              }

              result = result.replace(new RegExp(`\\{${key}\\}`, 'g'), displayValue);
            }
          }

          // Handle missing AI variables with loading placeholders or fallback values
          const aiVariablePattern = /\{ai-[^}]+\}/g;
          const missingAIVars = result.match(aiVariablePattern);
          if (missingAIVars) {
            missingAIVars.forEach(varName => {
              const cleanVarName = varName.slice(1, -1); // Remove { and }
              if (!aiData[cleanVarName]) {
                // Provide fallback values for common AI variables
                let fallbackValue = `${cleanVarName} (generating...)`;

                if (cleanVarName === 'ai-evaluation') {
                  fallbackValue = 'AI evaluation is being generated...';
                } else if (cleanVarName === 'ai-grade') {
                  fallbackValue = 'Grade: Generating...';
                } else if (cleanVarName === 'ai-funfact') {
                  fallbackValue = 'Fun fact is being generated...';
                }

                result = result.replace(new RegExp(`\\${varName}`, 'g'), fallbackValue);
              }
            });
          }

          // Form data
          for (const [key, value] of Object.entries(formData))
            result = result.replace(new RegExp(`\\{${key}\\}`, 'g'), value || '[not provided]');

          return result;
        }

        function renderWizard() {
          const steps = getSteps();
          const mainContent = document.getElementById('main-content');

          mainContent.innerHTML = steps.map(step => {
            const view = parsedScript.views[step.viewName];
            const interpolated = interpolateVariables(view.content);
            const html = marked.parse(interpolated);

            // Add submit button if view has type="submit"
            let submitButton = '';
            if (view.type === 'submit') {
              submitButton = `
                <div style="margin-top: 1rem; text-align: center;">
                  <button type="button" class="submit-btn" data-step="${step.id}" style="width: auto; display: inline-block;">
                    <i data-lucide="save"></i>
                    Save Results
                  </button>
                </div>
              `;
            }

            return `<div id="step-${step.id}" class="step-content" data-step="${step.id}">${html}${submitButton}</div>`;
          }).join('');

          restoreFormValues(mainContent);
          refreshIcons();
        }

        // New function to update only a specific step's content without rebuilding the entire DOM
        function updateStepContent(stepId) {
          const stepElement = document.getElementById(`step-${stepId}`);
          if (!stepElement) return;

          const steps = getSteps();
          const step = steps.find(s => s.id === stepId);
          if (!step) return;

          const view = parsedScript.views[step.viewName];
          const interpolated = interpolateVariables(view.content);
          const html = marked.parse(interpolated);

          // Add submit button if view has type="submit"
          let submitButton = '';
          if (view.type === 'submit') {
            submitButton = `
              <div style="margin-top: 1rem; text-align: center;">
                <button type="button" class="submit-btn" data-step="${stepId}" style="width: auto; display: inline-block;">
                  <i data-lucide="save"></i>
                  Save Results
                </button>
              </div>
            `;
          }

          const fullContent = html + submitButton;

          // Only update if content has actually changed
          if (stepElement.innerHTML !== fullContent) {
            stepElement.innerHTML = fullContent;
            restoreFormValues(stepElement);
            refreshIcons();

            // Attach submit button event listeners for views with type="submit"
            if (view.type === 'submit') {
              const submitBtn = stepElement.querySelector('.submit-btn');
              if (submitBtn && !submitBtn.hasAttribute('data-listener-attached')) {
                submitBtn.setAttribute('data-listener-attached', 'true');
                submitBtn.addEventListener('click', async (e) => {
                  e.preventDefault();
                  try {
                    await saveToDatabase();
                  } catch (error) {
                    console.error('Save failed:', error);
                  }
                });
              }
            }
          }
        }

        function renderStepMenu() {
          const steps = getSteps();
          const menu = document.getElementById('step-menu');

          // Create step navigation items
          const stepItems = steps.map(step => `
        <li><a href="#" data-step="${step.id}">${step.id}/${steps.length} - ${step.name}</a></li>
      `).join('');

          // Create auxiliary menu items
          const auxItems = `
        <li><a href="#" data-aux="help" class="secondary"><i data-lucide="help-circle"></i> Help</a></li>
        <li><a href="#" data-aux="about" class="secondary"><i data-lucide="info"></i> About</a></li>
        <li><a href="#" data-aux="settings" class="secondary"><i data-lucide="settings"></i> Settings</a></li>
        <li><a href="#" data-db="manager" class="secondary"><i data-lucide="database"></i> DB Inspector</a></li>
      `;

          menu.innerHTML = stepItems + auxItems;
        }

        // -------------------------------
        // Events
        // -------------------------------
        let eventListenersAttached = false;
        const eventListeners = new Map(); // Track attached listeners

        function attachEventListeners() {
          // Prevent duplicate event listeners
          if (eventListenersAttached) return;
          eventListenersAttached = true;

          // Step control buttons
          const backBtn = domCache.get('back-btn');
          const nextBtn = domCache.get('next-btn');
          const stepMenuBtn = domCache.get('step-menu-btn');

          if (!eventListeners.has('back-btn')) {
            backBtn.addEventListener('click', previousStep);
            eventListeners.set('back-btn', true);
          }

          if (!eventListeners.has('next-btn')) {
            nextBtn.addEventListener('click', nextStep);
            eventListeners.set('next-btn', true);
          }

          // Hamburger menu button
          if (!eventListeners.has('step-menu-btn')) {
            stepMenuBtn.addEventListener('click', () => {
              domCache.get('step-menu-dialog').showModal();
              refreshIcons();
            });
            eventListeners.set('step-menu-btn', true);
          }

          // Step menu dialog click -> navigate or open aux
          document.getElementById('step-menu').addEventListener('click', async (e) => {
            const stepLink = e.target.closest('a[data-step]');
            const auxLink = e.target.closest('a[data-aux]');
            const dbLink = e.target.closest('a[data-db]');

            if (stepLink) {
              e.preventDefault();
              const stepId = parseInt(stepLink.dataset.step, 10);
              await goToStep(stepId);
              closeStepMenuDialog();
            } else if (auxLink) {
              e.preventDefault();
              const auxType = auxLink.dataset.aux;
              closeStepMenuDialog();
              openAuxFromTag(auxType);
            } else if (dbLink) {
              e.preventDefault();
              const dbType = dbLink.dataset.db;
              if (dbType === 'manager') {
                closeStepMenuDialog();
                openDatabaseDialog();
              }
            }
          });

          // Track form input live into formData
          document.addEventListener('input', (e) => {
            const t = e.target;
            if (t && t.name) {
              formData[t.name] = t.value;
              // Clear cache when form data changes to ensure fresh AI generation
              aiDataCache = {};
            }
          });
          document.addEventListener('change', (e) => {
            const t = e.target;
            if (t && t.name) {
              formData[t.name] = t.value;
              // Clear cache when form data changes to ensure fresh AI generation
              aiDataCache = {};
            }
          });


          // Step menu dialog close buttons
          document.getElementById('step-menu-close').addEventListener('click', closeStepMenuDialog);
          document.getElementById('step-menu-ok').addEventListener('click', closeStepMenuDialog);
          document.getElementById('step-menu-dialog').addEventListener('cancel', (e) => { e.preventDefault(); closeStepMenuDialog(); });

          // Aux dialog close buttons
          document.getElementById('aux-close').addEventListener('click', closeAux);
          document.getElementById('aux-ok').addEventListener('click', closeAux);
          document.getElementById('aux-dialog').addEventListener('cancel', (e) => { e.preventDefault(); closeAux(); });


          // Submit button event listeners are attached dynamically when views with type="submit" are rendered

          // Database dialog event listeners
          document.getElementById('db-close').addEventListener('click', closeDatabaseDialog);
          document.getElementById('db-ok').addEventListener('click', closeDatabaseDialog);
          document.getElementById('database-dialog').addEventListener('cancel', (e) => { e.preventDefault(); closeDatabaseDialog(); });

          // Database control buttons
          document.getElementById('refresh-db').addEventListener('click', async () => {
            await displayRecords();
          });

          document.getElementById('clear-db').addEventListener('click', async () => {
            if (confirm('Are you sure you want to clear all records from the database? This action cannot be undone.')) {
              const success = await clearAllRecords();
              if (success) {
                await displayRecords();
                // Also refresh both tables
                initializeDatabaseTable();
                initializeUserResultsTable();
                notyf.success('All records have been cleared from the database.');
              } else {
                notyf.error('Failed to clear records from the database.');
              }
            }
          });
        }

        // -------------------------------
        // Navigation
        // -------------------------------
        async function goToStep(stepId) {
          const steps = getSteps();
          if (stepId >= 1 && stepId <= steps.length) {
            currentStep = stepId;

            // Check if the current step's view contains AI variables
            const currentStepData = steps[stepId - 1];
            const viewContent = parsedScript.views[currentStepData.viewName].content;

            if (viewContainsAIVariables(viewContent)) {
              // Only generate AI data if the view actually contains AI variables
              try {
                await generateAIData();
                // Update the current step content with fresh AI data
                updateStepContent(stepId);
                // Refresh icons for any new elements
                refreshIcons();
              } catch (error) {
                console.error('AI Generation failed:', error);
                // Show error message to user but don't block navigation
                notyf.error(`AI Generation Failed: ${error.message}. Please check your API key and try again.`);
              }
            } else {
              // No AI variables in this view, just update the content normally
              updateStepContent(stepId);
              refreshIcons();
            }

            // Always update UI to show/hide the correct step
            updateUI();
            refreshIcons();

            // Scroll to top when navigating between steps
            window.scrollTo(0, 0);
          }
        }

        async function previousStep() {
          if (currentStep > 1) await goToStep(currentStep - 1);
        }

        async function nextStep() {
          const steps = getSteps();
          if (currentStep < steps.length) await goToStep(currentStep + 1);
        }

        // -------------------------------
        // UI update
        // -------------------------------
        function updateUI() {
          const steps = getSteps();
          const maxSteps = steps.length;
          const currentStepData = steps[currentStep - 1];

          // Defensive check - if no steps or current step data is undefined, don't update UI
          if (!steps || steps.length === 0 || !currentStepData) {
            console.error('No steps available or current step data is undefined:', { steps, currentStep, currentStepData });
            return;
          }

          const progressEl = domCache.get('interactive-progress');
          progressEl.value = currentStep;
          progressEl.max = maxSteps;
          progressEl.setAttribute('aria-valuetext', `Step ${currentStep} of ${maxSteps}`);

          // Title text (preserve icon)
          const stepTitle = domCache.get('step-title');
          const titleIcon = stepTitle.querySelector('i[data-lucide]');
          stepTitle.textContent = `${currentStep}. ${currentStepData.name}`;
          if (titleIcon) stepTitle.prepend(titleIcon);

          // Show active step content
          document.querySelectorAll('.step-content').forEach(article => {
            const stepId = parseInt(article.dataset.step, 10);
            article.classList.toggle('active', stepId === currentStep);
          });

          // Highlight current item in dropdown
          document.querySelectorAll('#step-menu a[data-step]').forEach(a => {
            const stepId = parseInt(a.dataset.step, 10);
            a.toggleAttribute('aria-current', stepId === currentStep);
          });

          // Simple button state management
          const backBtn = domCache.get('back-btn');
          const nextBtn = domCache.get('next-btn');
          const hamburgerBtn = domCache.get('step-menu-btn');

          if (!backBtn || !nextBtn || !hamburgerBtn) return; // Exit if buttons don't exist yet

          // Back button: disabled on step 1, enabled on other steps
          backBtn.disabled = currentStep === 1;

          // Next button: disabled on last step
          nextBtn.disabled = currentStep === maxSteps;

          // Hamburger menu: always enabled (API key is validated before entering main app)
          hamburgerBtn.disabled = false;

          // Update Next button text
          nextBtn.innerHTML = 'Next <i data-lucide="arrow-right"></i>';

          // Ensure icons are refreshed after DOM updates
          refreshIcons();
        }

        // -------------------------------
        // Start the application
        // -------------------------------
        // Initialize splash screen first
        initSplashScreen();

        // Initialize main app after splash
        setTimeout(() => {
          init();
        }, 100); // Small delay to ensure splash is set up
      </script>
    </div> <!-- End app-wrapper -->
  </main>
</body>
